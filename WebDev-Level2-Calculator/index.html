<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Makes the layout scale correctly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Whole calculator body: display row + button grid -->
    <main class="calculator">
        <!-- Screen: top line = running expression, bottom line = typed number / result -->
        <div class="display">
            <div id="previous-operand" class="previous-operand"></div>
            <div id="current-operand" class="current-operand">0</div>
        </div>

        <!-- Row 1 -->
        <button class="span-two" id="clear">AC</button>
        <button id="delete">DEL</button>
        <button id="divide">÷</button>

        <!-- Row 2 -->
        <button id="digit-7">7</button>
        <button id="digit-8">8</button>
        <button id="digit-9">9</button>
        <button id="multiply">×</button>

        <!-- Row 3 -->
        <button id="digit-4">4</button>
        <button id="digit-5">5</button>
        <button id="digit-6">6</button>
        <button id="subtract">−</button>

        <!-- Row 4 -->
        <button id="digit-1">1</button>
        <button id="digit-2">2</button>
        <button id="digit-3">3</button>
        <button id="add">+</button>

        <!-- Row 5: 0 takes two columns so every row has exactly 4 cells -->
        <button class="span-two" id="digit-0">0</button>
        <button id="decimal">.</button>
        <button id="equals">=</button>
    </main>
    <script src="script.js"></script>
</body>
</html>
