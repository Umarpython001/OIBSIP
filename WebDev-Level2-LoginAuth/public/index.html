<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Phone-friendly scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Centred auth card -->
    <main class="card">
        <h1>Welcome back</h1>
        <p class="sub">Log in to reach your dashboard.</p>

        <!-- Login form: validated here for speed, enforced on the server -->
        <form id="login-form" novalidate>
            <label>Username or email
                <input id="login-id" type="text" autocomplete="username" required>
            </label>
            <label>Password
                <input id="login-pass" type="password" autocomplete="current-password" required>
            </label>
            <!-- Generic error: the server never reveals which field was wrong -->
            <p id="login-error" class="error" role="alert" hidden></p>
            <button type="submit">Login</button>
        </form>

        <p class="switch">No account? <a href="register.html">Register</a></p>
    </main>

    <script src="auth.js"></script>
    <script>
        // Page wiring: submit -> POST /api/login via Auth.handleLogin.
        document.getElementById('login-form').addEventListener('submit', Auth.handleLogin);
    </script>
</body>
</html>
